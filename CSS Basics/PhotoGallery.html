<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="gallery-section">
    <h1>Beautiful Moments Gallery</h1>

    <div class="gallery">
      <div class="photo">
        <img src="https://picsum.photos/400/300?random=1" alt="Nature 1">
        <div class="caption">Mountain Escape</div>
      </div>

      <div class="photo">
        <img src="https://picsum.photos/400/300?random=2" alt="Nature 2">
        <div class="caption">Serene Lake</div>
      </div>

      <div class="photo">
        <img src="https://picsum.photos/400/300?random=3" alt="Nature 3">
        <div class="caption">Forest Trail</div>
      </div>

      <div class="photo">
        <img src="https://picsum.photos/400/300?random=4" alt="Nature 4">
        <div class="caption">Desert Dunes</div>
      </div>

      <div class="photo">
        <img src="https://picsum.photos/400/300?random=5" alt="Nature 5">
        <div class="caption">Sunny Beach</div>
      </div>

      <div class="photo">
        <img src="https://picsum.photos/400/300?random=6" alt="Nature 6">
        <div class="caption">Starry Night</div>
      </div>
    </div>
  </section>
</body>
</html>
