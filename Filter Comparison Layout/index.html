<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="comparison-section">
        <h1>Before & After: CSS Filter Comparison</h1>
        <div class="image-comparison">
            <figure class="image-box">
                <img src="https://source.unsplash.com/600x400/?landscape,nature" alt="Original Image">
                <figcaption>Before – Original Image</figcaption>
            </figure>
            <figure class="image-box filtered">
                <img src="https://source.unsplash.com/600x400/?landscape,nature" alt="Filtered Image">
                <figcaption>After – Brightness + Contrast Filter</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
