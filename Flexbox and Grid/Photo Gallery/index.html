<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain View">
      <figcaption>Mountain View</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1025/400/300" alt="Forest Path">
      <figcaption>Forest Path</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1035/400/300" alt="Ocean Sunset">
      <figcaption>Ocean Sunset</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1045/400/300" alt="City Lights">
      <figcaption>City Lights</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1055/400/300" alt="Snowy Peaks">
      <figcaption>Snowy Peaks</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1065/400/300" alt="Desert Dunes">
      <figcaption>Desert Dunes</figcaption>

</html>
