<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Report Page</title>
</head>
<body>

  <h1>Sunrise Public School</h1>

  <table border="1" cellpadding="10" cellspacing="0" title="Student Marks Report">
    <thead>
      <tr>
        <th rowspan="2">Subject</th>
        <th colspan="2">Marks</th>
      </tr>
      <tr>
        <th>Obtained</th>
        <th>Out of</th>
      </tr>
    </thead>

    <tbody>
      <tr title="Marks for English">
        <td>English</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr title="Marks for Mathematics">
        <td>Mathematics</td>
        <td>92</td>
        <td>100</td>
      </tr>
      <tr title="Marks for Science">
        <td>Science</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr title="Marks for Social Studies">
        <td>Social Studies</td>
        <td>79</td>
        <td>100</td>
      </tr>
      <tr title="Marks for Computer Science">
        <td>Computer Science</td>
        <td>94</td>
        <td>100</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="3" style="text-align:center; font-weight:bold;">Total Marks: 438 / 500</td>
      </tr>
      <tr>
        <td colspan="3" style="text-align:center; font-weight:bold;">Percentage: 87.6%</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
