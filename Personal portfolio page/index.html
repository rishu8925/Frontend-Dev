<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

  <header class="text-center p-5">
    <h1 class="fw-bold mb-3">John Doe</h1>
    <p class="lead">Aspiring Web Developer | Creative Thinker | Problem Solver</p>
  </header>

  <main>
    <section class="container text-center mt-4">
      <img src="https://via.placeholder.com/200" alt="Profile" class="img-fluid rounded-circle mb-3">
      <div class="mb-4">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
      </div>

      <form class="mx-auto" style="max-width: 400px;">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Your Name">
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Your Email">
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="3" placeholder="Message"></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="text-center mt-5 p-3 bg-dark text-white">
    <p class="mb-0">© 2025 John Doe. All Rights Reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
