<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img src="https://source.unsplash.com/600x400/?mountain" alt="Mountain" class="filter-blur">
                <figcaption>Blur Effect</figcaption>
            </figure>
            <figure>
                <img src="https://source.unsplash.com/600x400/?city" alt="City" class="filter-grayscale">
                <figcaption>Grayscale Effect</figcaption>
            </figure>
            <figure>
                <img src="https://source.unsplash.com/600x400/?forest" alt="Forest" class="filter-sepia">
                <figcaption>Sepia Effect</figcaption>
            </figure>
            <figure>
                <img src="https://source.unsplash.com/600x400/?beach" alt="Beach" class="filter-brightness">
                <figcaption>Brightness Effect</figcaption>
            </figure>
            <figure>
                <img src="https://source.unsplash.com/600x400/?snow" alt="Snow" class="filter-contrast">
                <figcaption>Contrast Effect</figcaption>
            </figure>
            <figure>
                <img src="https://source.unsplash.com/600x400/?night" alt="Night" class="filter-hue">
                <figcaption>Hue Rotate Effect</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Creative Gallery by [Your Name]</p>
    </footer>
</body>
</html>
